[project]
name = "carenote-ai"
version = "0.1.0"
description = "German caregiver voice notes -> validated, structured care documentation (Strukturmodell)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "spacy>=3.8.18",
    "de-core-news-sm",
    "av>=11,<15",
    "pandas>=3.1.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carenote"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["carenote", "metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
